<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ResQ</title>
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<div class="admin-auth">

    <div class="admin-brand">
        <div class="admin-logo">🚨 ResQ</div>

        <span>ADMINISTRATION</span>

        <h1>
            ResQ<br>
            <strong>Control Center.</strong>
        </h1>

        <p>
            Manage users, verify responders and oversee
            emergency activity across the ResQ network.
        </p>
    </div>


    <div class="admin-login-box">

        <div class="mobile-admin-logo">
            🚨 ResQ
        </div>

        <span class="admin-label">SECURE ACCESS</span>

        <h2>Admin Login</h2>

        <p>
            Sign in to access the ResQ administration panel.
        </p>


        <form id="adminLoginForm">

            <div class="admin-form-group">

                <label for="adminEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="admin@example.com"
                    required
                >

            </div>


            <div class="admin-form-group">

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Access Admin Panel
            </button>

            <div id="adminLoginMessage"></div>

        </form>


        <a href="../frontend/login.html" class="admin-back-link">
            ← Back to ResQ
        </a>

    </div>

</div>


<script src="js/login.js"></script>

</body>
</html>
