<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | ResQ</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="auth-page">

        <!-- Left Side -->
        <div class="auth-brand">

            <a href="index.html" class="brand-logo">
                🚨 ResQ
            </a>

            <div class="brand-content">
                <span class="brand-label">JOIN THE NETWORK</span>

                <h1>
                    Be there when<br>
                    someone needs <span>help.</span>
                </h1>

                <p>
                    Create your ResQ account and become part of
                    a community that connects people with help nearby.
                </p>
            </div>

        </div>


        <!-- Right Side -->
        <div class="auth-form-container">

            <div class="auth-form">

                <a href="index.html" class="mobile-logo">
                    🚨 ResQ
                </a>

                <h2>Create your account</h2>

                <p class="form-subtitle">
                    Join ResQ in less than a minute.
                </p>


                <form id="registerForm">

                    <div class="form-group">
                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="9876543210"
                            maxlength="10"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a strong password"
                            required
                        >
                    </div>


                    <button type="submit" class="auth-button">
                        Create Account
                    </button>

                    <div id="registerMessage"></div>

                </form>


                <p class="switch-auth">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </div>

    </div>


    <script src="../js/auth.js"></script>

</body>
</html>
