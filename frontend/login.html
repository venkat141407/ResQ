<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ResQ</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

<div class="auth-page">

    <!-- Left Side -->
    <div class="auth-brand">

        <a href="index.html" class="brand-logo">
            🚨 ResQ
        </a>

        <div class="brand-content">

            <span class="brand-label">WELCOME BACK</span>

            <h1>
                Help is<br>
                <span>closer than you think.</span>
            </h1>

            <p>
                Sign in to access your ResQ account and connect
                with emergency assistance in your community.
            </p>

        </div>

    </div>


    <!-- Right Side -->
    <div class="auth-form-container">

        <div class="auth-form">

            <a href="index.html" class="mobile-logo">
                🚨 ResQ
            </a>

            <h2>Welcome back</h2>

            <p class="form-subtitle">
                Login to continue to ResQ.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="auth-button">
                    Login to ResQ
                </button>


                <div id="loginMessage"></div>

            </form>


            <p class="switch-auth">
                Don't have an account?
                <a href="register.html">Create account</a>
            </p>

        </div>

    </div>

</div>


<script src="../js/auth.js"></script>

</body>
</html>
